<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Finanțe personale</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f5c4a">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budgeting">
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1c1e21;
    --muted: #6b7280;
    --border: #dfe2e6;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --income: #16a34a;
    --expense: #dc2626;
    --error-bg: #fef2f2;
    --error-border: #fca5a5;
    --error-text: #991b1b;
    --success-bg: #f0fdf4;
    --success-border: #86efac;
    --success-text: #166534;
    --offline-bg: #fffbeb;
    --offline-border: #fcd34d;
    --offline-text: #92400e;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 16px;
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
  }

  h1 {
    font-size: 1.25rem;
    text-align: center;
    margin: 4px 0 16px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }

  .segmented {
    display: flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px;
    gap: 4px;
    margin-bottom: 16px;
  }

  .segmented button {
    flex: 1;
    border: none;
    background: transparent;
    padding: 10px 8px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
  }

  .segmented button.active {
    background: var(--accent);
    color: var(--accent-text);
  }

  .segmented.type-toggle button.active.income { background: var(--income); }
  .segmented.type-toggle button.active.expense { background: var(--expense); }

  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
    margin: 14px 0 6px;
  }

  label:first-of-type { margin-top: 0; }

  select, input[type="text"], input[type="number"], input[type="date"] {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
    background: #fff;
    color: var(--text);
  }

  select:focus, input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .field-error {
    color: var(--expense);
    font-size: 0.8rem;
    margin-top: 4px;
    display: none;
  }

  .field-error.show { display: block; }

  .submit-btn {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }

  .submit-btn:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .banner {
    border-radius: var(--radius);
    padding: 12px 14px;
    font-size: 0.9rem;
    margin-bottom: 16px;
    display: none;
    line-height: 1.4;
  }

  .banner.show { display: block; }

  .banner.success {
    background: var(--success-bg);
    border: 1px solid var(--success-border);
    color: var(--success-text);
  }

  .banner.error {
    background: var(--error-bg);
    border: 1px solid var(--error-border);
    color: var(--error-text);
  }

  .banner.offline {
    background: var(--offline-bg);
    border: 1px solid var(--offline-border);
    color: var(--offline-text);
  }

  .sync-status {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--offline-bg);
    border: 1px solid var(--offline-border);
    color: var(--offline-text);
    border-radius: var(--radius);
    padding: 10px 14px;
    font-size: 0.85rem;
    margin-bottom: 16px;
  }

  .sync-status button {
    flex-shrink: 0;
    border: 1px solid var(--offline-border);
    background: #fff;
    color: var(--offline-text);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }

  .sync-status button:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .hidden { display: none !important; }

  .hint {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 4px;
  }

  .quick-categories {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
  }

  .quick-chip {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }

  .quick-chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
  }

  .suggestion-list {
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 8px 8px;
    background: #fff;
    max-height: 240px;
    overflow-y: auto;
  }

  .suggestion-item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 11px 12px;
    border: none;
    border-top: 1px solid var(--border);
    background: none;
    font-size: 0.95rem;
    color: var(--text);
    cursor: pointer;
  }

  .suggestion-item:first-child { border-top: none; }
  .suggestion-item:active { background: var(--bg); }

  .status-loading {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    padding: 20px 0;
  }
</style>
</head>
<body>
<div class="app">
  <h1>Finanțe personale</h1>

  <div id="globalBanner" class="banner"></div>

  <div id="syncStatus" class="sync-status hidden">
    <span id="syncCount"></span>
    <button type="button" id="syncNowBtn">Sincronizează acum</button>
  </div>

  <div id="loading" class="status-loading">Se încarcă conturile și categoriile…</div>

  <div id="content" class="hidden">
    <div class="segmented" id="modeToggle">
      <button type="button" data-mode="transaction" class="active">Tranzacție</button>
      <button type="button" data-mode="transfer">Transfer</button>
    </div>

    <!-- ===== Transaction form ===== -->
    <form id="transactionForm" class="card">
      <div class="segmented type-toggle" id="typeToggle">
        <button type="button" data-type="Expense" class="active expense">Cheltuială</button>
        <button type="button" data-type="Income" class="income">Venit</button>
      </div>

      <label for="txAccount">Cont</label>
      <select id="txAccount"></select>

      <label for="txCategory">Categorie</label>
      <div class="quick-categories hidden" id="txQuickCategories"></div>
      <select id="txCategory">
        <option value="">-- alege categoria --</option>
      </select>
      <div class="field-error" id="txCategoryError">Alege o categorie.</div>

      <label for="txDescription">Descriere</label>
      <input type="text" id="txDescription" autocomplete="off" placeholder="ex: Cumpărături">
      <div class="suggestion-list hidden" id="txDescriptionSuggestions"></div>

      <label for="txAmount">Sumă</label>
      <input type="number" id="txAmount" min="0" step="0.01" placeholder="0.00">
      <div class="field-error" id="txAmountError">Introdu o sumă pozitivă.</div>

      <label for="txDate">Dată</label>
      <input type="date" id="txDate">

      <button type="submit" class="submit-btn" id="txSubmit">Salvează</button>
    </form>

    <!-- ===== Transfer form ===== -->
    <form id="transferForm" class="card hidden">
      <label for="trSourceAccount">Cont sursă</label>
      <select id="trSourceAccount"></select>

      <label for="trDestAccount">Cont destinație</label>
      <select id="trDestAccount"></select>
      <div class="field-error" id="trAccountError">Conturile sursă și destinație trebuie să fie diferite.</div>

      <label for="trSourceAmount">Sumă sursă</label>
      <input type="number" id="trSourceAmount" min="0" step="0.01" placeholder="0.00">
      <div class="field-error" id="trSourceAmountError">Introdu o sumă pozitivă.</div>

      <label for="trDestAmount">Sumă destinație</label>
      <input type="number" id="trDestAmount" min="0" step="0.01" placeholder="0.00">
      <div class="hint" id="trFxHint"></div>
      <div class="field-error" id="trDestAmountError">Introdu o sumă pozitivă.</div>

      <label for="trDescription">Descriere</label>
      <input type="text" id="trDescription" placeholder="ex: Economii lunare">

      <label for="trDate">Dată</label>
      <input type="date" id="trDate">

      <button type="submit" class="submit-btn" id="trSubmit">Confirmă</button>
    </form>
  </div>
</div>

<script>
// ============ CONFIGURARE ============
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbylP-vssh8iUL3_34vcJhbZ8sY_07HJhXvJC9EGs9fOT16ol0SEUNX_ecmOazgGZPewsg/exec";
const API_TOKEN = "57VLsIn_u7z1QAJ5wNWiat17BgIvip0e";
// ======================================

let accounts = [];
let categories = [];
let transactions = [];
let descriptionIndex = new Map();
let currentMode = 'transaction';
let currentType = 'Expense';
let destAmountManuallyEdited = false;
let fxDebounceHandle = null;

const TRANSACTION_HISTORY_LIMIT = 200;
const QUICK_CATEGORY_LIMIT = 4;
const DESCRIPTION_SUGGESTION_LIMIT = 8;

const el = (id) => document.getElementById(id);

function todayStr() {
  const d = new Date();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${d.getFullYear()}-${m}-${day}`;
}

function showGlobalBanner(message, type) {
  const banner = el('globalBanner');
  banner.textContent = message;
  banner.className = `banner show ${type}`;
}

function hideGlobalBanner() {
  el('globalBanner').className = 'banner';
}

function setFieldError(id, show) {
  el(id).classList.toggle('show', !!show);
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

// ---------- API helpers ----------
// Thrown for connectivity problems (offline, timeout, DNS/CORS failure) — distinct from a
// server response that came back but reported a validation/business error, which must NOT
// be queued for offline retry.
class NetworkError extends Error {}

function buildUrl(action, params) {
  const url = new URL(WEBAPP_URL);
  url.searchParams.set('action', action);
  if (API_TOKEN) url.searchParams.set('token', API_TOKEN);
  Object.entries(params || {}).forEach(([k, v]) => {
    if (v !== undefined && v !== null) url.searchParams.set(k, v);
  });
  return url.toString();
}

async function fetchWithTimeout(input, options, timeoutMs) {
  const controller = new AbortController();
  const handle = setTimeout(() => controller.abort(), timeoutMs);
  try {
    return await fetch(input, Object.assign({}, options, { signal: controller.signal }));
  } catch (err) {
    throw new NetworkError(err.name === 'AbortError' ? 'Cererea a expirat' : 'Eroare de rețea');
  } finally {
    clearTimeout(handle);
  }
}

async function apiGet(action, params, timeoutMs = 15000) {
  const res = await fetchWithTimeout(buildUrl(action, params), undefined, timeoutMs);
  let json;
  try {
    json = await res.json();
  } catch (err) {
    throw new NetworkError('Răspuns invalid de la server');
  }
  if (!json.success) throw new Error(json.error || 'Eroare necunoscută');
  return json.data;
}

async function apiPost(action, payload, timeoutMs = 15000) {
  // No custom headers -> request stays a CORS "simple request" (text/plain),
  // which avoids an OPTIONS preflight that Apps Script web apps don't handle.
  const body = JSON.stringify(Object.assign({ action, token: API_TOKEN }, payload));
  const res = await fetchWithTimeout(WEBAPP_URL, { method: 'POST', body }, timeoutMs);
  let json;
  try {
    json = await res.json();
  } catch (err) {
    throw new NetworkError('Răspuns invalid de la server');
  }
  if (!json.success) throw new Error(json.error || 'Eroare necunoscută');
  return json.data;
}

// ---------- Offline queue ----------
const QUEUE_KEY = 'budgeting_offline_queue';
let syncInProgress = false;

function loadQueue() {
  try {
    return JSON.parse(localStorage.getItem(QUEUE_KEY)) || [];
  } catch (err) {
    return [];
  }
}

function saveQueue(queue) {
  localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
}

function enqueueRequest(action, payload) {
  const queue = loadQueue();
  queue.push({
    localId: Date.now() + '-' + Math.random().toString(36).slice(2),
    action,
    payload,
    createdAt: new Date().toISOString()
  });
  saveQueue(queue);
  updateSyncBadge();
}

function updateSyncBadge() {
  const queue = loadQueue();
  const status = el('syncStatus');
  const count = el('syncCount');
  if (queue.length === 0) {
    status.classList.add('hidden');
    return;
  }
  status.classList.remove('hidden');
  count.textContent = queue.length === 1
    ? '1 intrare în așteptare de sincronizare'
    : `${queue.length} intrări în așteptare de sincronizare`;
}

async function syncQueue() {
  if (syncInProgress) return;
  syncInProgress = true;
  const syncBtn = el('syncNowBtn');
  if (syncBtn) { syncBtn.disabled = true; syncBtn.textContent = 'Se sincronizează...'; }

  try {
    let queue = loadQueue();
    while (queue.length > 0) {
      const item = queue[0];
      try {
        await apiPost(item.action, item.payload);
      } catch (err) {
        break; // stop at first failure, in order — remaining items stay queued for next try
      }
      queue.shift();
      saveQueue(queue);
      updateSyncBadge();
    }
  } finally {
    syncInProgress = false;
    if (syncBtn) { syncBtn.disabled = false; syncBtn.textContent = 'Sincronizează acum'; }
  }
}

window.addEventListener('online', syncQueue);
el('syncNowBtn').addEventListener('click', syncQueue);

// ---------- Init ----------
const ACCOUNTS_CACHE_KEY = 'budgeting_cached_accounts';
const CATEGORIES_CACHE_KEY = 'budgeting_cached_categories';
const TRANSACTIONS_CACHE_KEY = 'budgeting_cached_transactions';

// ---------- Smart autocomplete (quick categories + description suggestions) ----------
// Phone keyboards can produce accented characters (ă, â, î) as different Unicode byte
// sequences (precomposed vs. combining-mark form) depending on how they were typed —
// normalizing to NFC before comparing/keying avoids silent lookup misses for those.
function normalizeDescription(str) {
  return String(str || '').trim().normalize('NFC').toLowerCase();
}

function trimTransactionHistory(list) {
  return list.slice()
    .sort((a, b) => String(b.date).localeCompare(String(a.date)) || Number(b.id) - Number(a.id))
    .slice(0, TRANSACTION_HISTORY_LIMIT);
}

function buildDescriptionIndex(list) {
  const index = new Map();
  list.forEach((t) => {
    const description = (t.description || '').trim();
    if (!description) return;
    const key = normalizeDescription(description);
    if (!index.has(key)) index.set(key, { displayName: description, count: 0, latest: t });
    const entry = index.get(key);
    entry.count += 1;
    const isNewer = String(t.date).localeCompare(String(entry.latest.date)) > 0 ||
      (t.date === entry.latest.date && Number(t.id) > Number(entry.latest.id));
    if (isNewer) entry.latest = t;
  });
  return index;
}

function computeTopCategories(type, limit) {
  const counts = new Map();
  transactions.forEach((t) => {
    if (t.type !== type || !t.category) return;
    counts.set(t.category, (counts.get(t.category) || 0) + 1);
  });
  return Array.from(counts.entries())
    .sort((a, b) => b[1] - a[1])
    .slice(0, limit)
    .map(([name]) => name);
}

function renderQuickCategories() {
  const container = el('txQuickCategories');
  const top = computeTopCategories(currentType, QUICK_CATEGORY_LIMIT);
  if (top.length === 0) {
    container.classList.add('hidden');
    container.innerHTML = '';
    return;
  }
  container.classList.remove('hidden');
  container.innerHTML = top.map((name) =>
    `<button type="button" class="quick-chip" data-category="${escapeHtml(name)}">${escapeHtml(name)}</button>`
  ).join('');
  syncQuickCategoryActive();
}

function syncQuickCategoryActive() {
  const value = el('txCategory').value;
  document.querySelectorAll('#txQuickCategories .quick-chip').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.category === value);
  });
}

function hideDescriptionSuggestions() {
  const list = el('txDescriptionSuggestions');
  list.classList.add('hidden');
  list.innerHTML = '';
}

function updateDescriptionSuggestions() {
  const query = normalizeDescription(el('txDescription').value);
  if (!query || descriptionIndex.size === 0) {
    hideDescriptionSuggestions();
    return;
  }
  const matches = Array.from(descriptionIndex.entries())
    .filter(([key]) => key.includes(query))
    .sort((a, b) => b[1].count - a[1].count)
    .slice(0, DESCRIPTION_SUGGESTION_LIMIT);
  if (matches.length === 0) {
    hideDescriptionSuggestions();
    return;
  }
  const list = el('txDescriptionSuggestions');
  list.classList.remove('hidden');
  list.innerHTML = matches.map(([key, entry]) =>
    `<button type="button" class="suggestion-item" data-key="${escapeHtml(key)}">${escapeHtml(entry.displayName)}</button>`
  ).join('');
}

// Applies category/amount straight from the matched entry object rather than re-parsing
// the input field's text — avoids depending on native mobile autocomplete UI/events at all.
function applyDescriptionEntry(entry) {
  const categoryValid = categories.some((c) => c.type === currentType && c.name === entry.latest.category);
  if (categoryValid) {
    el('txCategory').value = entry.latest.category;
    setFieldError('txCategoryError', false);
    syncQuickCategoryActive();
  }
  el('txAmount').value = entry.latest.amount;
}

function maybeAutofillFromDescription() {
  const value = normalizeDescription(el('txDescription').value);
  if (!value) return;
  const entry = descriptionIndex.get(value);
  if (!entry) return;
  applyDescriptionEntry(entry);
}

// A PWA resume (reopening after the OS backgrounds it) often does not re-run this script,
// so a transaction just submitted must be folded into in-memory history right away —
// otherwise the next entry in the same session won't get category/amount prefill for it
// until a full reload re-fetches from the server.
function recordLocalTransaction(payload, serverId) {
  transactions.push({
    id: serverId != null ? serverId : Date.now(),
    account_id: payload.account_id,
    date: payload.date,
    type: payload.type,
    category: payload.category,
    description: payload.description,
    amount: payload.amount
  });
  transactions = trimTransactionHistory(transactions);
  descriptionIndex = buildDescriptionIndex(transactions);
  localStorage.setItem(TRANSACTIONS_CACHE_KEY, JSON.stringify(transactions));
  renderQuickCategories();
}

async function loadTransactionHistory() {
  try {
    const data = await apiGet('getTransactions');
    transactions = trimTransactionHistory(data);
    localStorage.setItem(TRANSACTIONS_CACHE_KEY, JSON.stringify(transactions));
  } catch (err) {
    const cached = localStorage.getItem(TRANSACTIONS_CACHE_KEY);
    transactions = cached ? JSON.parse(cached) : [];
  }
  descriptionIndex = buildDescriptionIndex(transactions);
  renderQuickCategories();
}

function renderApp() {
  populateAccountSelects();
  populateCategorySelect();
  renderQuickCategories();
  el('txDate').value = todayStr();
  el('trDate').value = todayStr();

  el('loading').classList.add('hidden');
  el('content').classList.remove('hidden');
  updateSyncBadge();
  if (navigator.onLine) syncQueue();
}

async function init() {
  try {
    const [accountsData, categoriesData] = await Promise.all([
      apiGet('getAccounts'),
      apiGet('getCategories')
    ]);
    accounts = accountsData;
    categories = categoriesData;
    localStorage.setItem(ACCOUNTS_CACHE_KEY, JSON.stringify(accounts));
    localStorage.setItem(CATEGORIES_CACHE_KEY, JSON.stringify(categories));

    renderApp();
  } catch (err) {
    const cachedAccounts = localStorage.getItem(ACCOUNTS_CACHE_KEY);
    const cachedCategories = localStorage.getItem(CATEGORIES_CACHE_KEY);
    if (err instanceof NetworkError && cachedAccounts && cachedCategories) {
      accounts = JSON.parse(cachedAccounts);
      categories = JSON.parse(cachedCategories);
      renderApp();
      showGlobalBanner('Fără conexiune — se folosesc conturile și categoriile salvate anterior.', 'offline');
    } else {
      el('loading').classList.add('hidden');
      showGlobalBanner('Nu s-au putut încărca datele inițiale: ' + err.message, 'error');
    }
  }
}

function populateAccountSelects() {
  const optionsHtml = accounts
    .map(a => `<option value="${a.id}">${a.name} (${a.currency})</option>`)
    .join('');

  el('txAccount').innerHTML = optionsHtml;
  const checking = accounts.find(a => a.name === 'Checking');
  if (checking) el('txAccount').value = checking.id;

  el('trSourceAccount').innerHTML = `<option value="">-- alege cont --</option>` + optionsHtml;
  el('trDestAccount').innerHTML = `<option value="">-- alege cont --</option>` + optionsHtml;
}

function populateCategorySelect() {
  const select = el('txCategory');
  const filtered = categories.filter(c => c.type === currentType);
  select.innerHTML = '<option value="">-- alege categoria --</option>' +
    filtered.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
}

// ---------- Mode / type toggles ----------
el('modeToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-mode]');
  if (!btn) return;
  currentMode = btn.dataset.mode;
  document.querySelectorAll('#modeToggle button').forEach(b => b.classList.toggle('active', b === btn));
  el('transactionForm').classList.toggle('hidden', currentMode !== 'transaction');
  el('transferForm').classList.toggle('hidden', currentMode !== 'transfer');
  hideGlobalBanner();
});

el('typeToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-type]');
  if (!btn) return;
  currentType = btn.dataset.type;
  document.querySelectorAll('#typeToggle button').forEach(b => b.classList.toggle('active', b === btn));
  populateCategorySelect();
  renderQuickCategories();
  setFieldError('txCategoryError', false);
});

el('txQuickCategories').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-category]');
  if (!btn) return;
  el('txCategory').value = btn.dataset.category;
  setFieldError('txCategoryError', false);
  syncQuickCategoryActive();
});

el('txCategory').addEventListener('change', syncQuickCategoryActive);

el('txDescription').addEventListener('input', () => {
  updateDescriptionSuggestions();
  maybeAutofillFromDescription();
});

el('txDescriptionSuggestions').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-key]');
  if (!btn) return;
  const entry = descriptionIndex.get(btn.dataset.key);
  if (!entry) return;
  el('txDescription').value = entry.displayName;
  applyDescriptionEntry(entry);
  hideDescriptionSuggestions();
});

document.addEventListener('click', (e) => {
  const list = el('txDescriptionSuggestions');
  if (list.classList.contains('hidden')) return;
  if (e.target === el('txDescription') || list.contains(e.target)) return;
  hideDescriptionSuggestions();
});

// ---------- Transfer: prevent same account, drive FX autofill ----------
function refreshDestAccountOptions() {
  const sourceId = el('trSourceAccount').value;
  Array.from(el('trDestAccount').options).forEach(opt => {
    opt.disabled = opt.value !== '' && opt.value === sourceId;
  });
  if (el('trDestAccount').value === sourceId && sourceId !== '') {
    el('trDestAccount').value = '';
  }
}

function getAccountById(id) {
  return accounts.find(a => String(a.id) === String(id));
}

async function maybeAutoFillDestAmount() {
  if (destAmountManuallyEdited) return;

  const source = getAccountById(el('trSourceAccount').value);
  const dest = getAccountById(el('trDestAccount').value);
  const sourceAmount = parseFloat(el('trSourceAmount').value);

  el('trFxHint').textContent = '';
  if (!source || !dest || source.currency === dest.currency) return;
  if (!(sourceAmount > 0)) return;

  try {
    el('trFxHint').textContent = 'Se obține cursul de schimb...';
    const fx = await apiGet('getFxRate', { from_currency: source.currency, to_currency: dest.currency });
    if (destAmountManuallyEdited) return; // user typed while we were fetching
    const computed = sourceAmount * fx.rate;
    el('trDestAmount').value = computed.toFixed(2);
    el('trFxHint').textContent = `Curs ${source.currency}→${dest.currency}: ${fx.rate} (${fx.date})`;
  } catch (err) {
    el('trFxHint').textContent = 'Nu s-a putut obține cursul de schimb: ' + err.message;
  }
}

el('trSourceAccount').addEventListener('change', () => {
  refreshDestAccountOptions();
  destAmountManuallyEdited = false;
  maybeAutoFillDestAmount();
});

el('trDestAccount').addEventListener('change', () => {
  destAmountManuallyEdited = false;
  maybeAutoFillDestAmount();
});

el('trSourceAmount').addEventListener('input', () => {
  clearTimeout(fxDebounceHandle);
  fxDebounceHandle = setTimeout(maybeAutoFillDestAmount, 400);
});

el('trDestAmount').addEventListener('input', () => {
  destAmountManuallyEdited = true;
});

// ---------- Transaction submit ----------
el('transactionForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideGlobalBanner();

  const accountId = el('txAccount').value;
  const category = el('txCategory').value;
  const description = el('txDescription').value.trim();
  const amount = parseFloat(el('txAmount').value);
  const date = el('txDate').value;

  const categoryMissing = !category;
  const amountInvalid = !(amount > 0);
  setFieldError('txCategoryError', categoryMissing);
  setFieldError('txAmountError', amountInvalid);
  if (categoryMissing || amountInvalid || !accountId || !date) {
    if (!date) showGlobalBanner('Alege o dată.', 'error');
    return;
  }

  const submitBtn = el('txSubmit');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Se salvează...';

  const txPayload = {
    account_id: accountId,
    date,
    type: currentType,
    category,
    description,
    amount
  };

  try {
    const data = await apiPost('addTransaction', txPayload);
    const account = getAccountById(data.account_id);
    showGlobalBanner(
      `Salvat! Sold ${account ? account.name : data.account_id}: ${Number(data.balance).toFixed(2)} ${account ? account.currency : ''}`,
      'success'
    );
    recordLocalTransaction(txPayload, data.id);

    // Reset to defaults, keep type/category as-is for fast repeated entry.
    const checking = accounts.find(a => a.name === 'Checking');
    if (checking) el('txAccount').value = checking.id;
    el('txDate').value = todayStr();
    el('txAmount').value = '';
    el('txDescription').value = '';
    hideDescriptionSuggestions();
  } catch (err) {
    if (err instanceof NetworkError) {
      enqueueRequest('addTransaction', txPayload);
      showGlobalBanner('Salvat local, se va sincroniza automat.', 'offline');
      recordLocalTransaction(txPayload, null);

      const checking = accounts.find(a => a.name === 'Checking');
      if (checking) el('txAccount').value = checking.id;
      el('txDate').value = todayStr();
      el('txAmount').value = '';
      el('txDescription').value = '';
      hideDescriptionSuggestions();
    } else {
      showGlobalBanner('Eroare la salvare: ' + err.message, 'error');
    }
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Salvează';
  }
});

// ---------- Transfer submit ----------
el('transferForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideGlobalBanner();

  const sourceId = el('trSourceAccount').value;
  const destId = el('trDestAccount').value;
  const sourceAmount = parseFloat(el('trSourceAmount').value);
  const destAmount = parseFloat(el('trDestAmount').value);
  const description = el('trDescription').value.trim();
  const date = el('trDate').value;

  const accountsInvalid = !sourceId || !destId || sourceId === destId;
  const sourceAmountInvalid = !(sourceAmount > 0);
  const destAmountInvalid = !(destAmount > 0);
  setFieldError('trAccountError', accountsInvalid);
  setFieldError('trSourceAmountError', sourceAmountInvalid);
  setFieldError('trDestAmountError', destAmountInvalid);
  if (accountsInvalid || sourceAmountInvalid || destAmountInvalid || !date) {
    if (!date) showGlobalBanner('Alege o dată.', 'error');
    return;
  }

  const submitBtn = el('trSubmit');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Se confirmă...';

  const trPayload = {
    date,
    source_account_id: sourceId,
    dest_account_id: destId,
    source_amount: sourceAmount,
    dest_amount: destAmount,
    description
  };

  function resetTransferForm() {
    el('trSourceAccount').value = '';
    el('trDestAccount').value = '';
    refreshDestAccountOptions();
    el('trSourceAmount').value = '';
    el('trDestAmount').value = '';
    el('trFxHint').textContent = '';
    el('trDescription').value = '';
    el('trDate').value = todayStr();
    destAmountManuallyEdited = false;
  }

  try {
    const data = await apiPost('addTransfer', trPayload);
    const srcAcc = getAccountById(data.source_account.account_id);
    const dstAcc = getAccountById(data.dest_account.account_id);
    showGlobalBanner(
      `Confirmat! Sold ${srcAcc ? srcAcc.name : ''}: ${Number(data.source_account.balance).toFixed(2)} ${srcAcc ? srcAcc.currency : ''} · ` +
      `Sold ${dstAcc ? dstAcc.name : ''}: ${Number(data.dest_account.balance).toFixed(2)} ${dstAcc ? dstAcc.currency : ''}`,
      'success'
    );
    resetTransferForm();
  } catch (err) {
    if (err instanceof NetworkError) {
      enqueueRequest('addTransfer', trPayload);
      showGlobalBanner('Salvat local, se va sincroniza automat.', 'offline');
      resetTransferForm();
    } else {
      showGlobalBanner('Eroare la confirmare: ' + err.message, 'error');
    }
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Confirmă';
  }
});

init();
loadTransactionHistory();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((err) => {
      console.error('Înregistrarea service worker-ului a eșuat:', err);
    });
  });
}
</script>
